name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  # Auto-patch on main when HEAD is not already tagged.
  # NOTE: pushes made with GITHUB_TOKEN do not trigger new workflows, so we
  # must publish in this same job (cannot rely on the tag push event).
  release-main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if release commit or already tagged
        id: guard
        run: |
          msg=$(git log -1 --pretty=%B)
          if echo "$msg" | grep -q '\[skip release\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: commit has [skip release]"
            exit 0
          fi
          if git describe --exact-match --tags HEAD 2>/dev/null | grep -q '^v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: HEAD already tagged"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
          package-manager-cache: false

      - if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - if: steps.guard.outputs.skip != 'true'
        run: npm run typecheck

      - if: steps.guard.outputs.skip != 'true'
        run: npm test

      - if: steps.guard.outputs.skip != 'true'
        run: npm run build

      - name: Bump patch, commit, tag
        if: steps.guard.outputs.skip != 'true'
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore: release v%s [skip release]"
          ver=$(node -p "require('./package.json').version")
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main --follow-tags

      - name: Publish to npm
        if: steps.guard.outputs.skip != 'true'
        run: npm publish --access public

      - name: GitHub Release
        if: steps.guard.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Manual tags (human push). GITHUB_TOKEN tag pushes from release-main do not
  # reach here — that path publishes above.
  publish-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(node -p "require('./package.json').version")
          if [ "$tag" != "$ver" ]; then
            echo "Tag v$tag != package.json version $ver"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Skip if version already on npm
        id: exists
        run: |
          ver=$(node -p "require('./package.json').version")
          if npm view "@pickpoint/sdk@$ver" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $ver already published — skip npm publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.exists.outputs.exists != 'true'
        run: npm publish --access public

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
